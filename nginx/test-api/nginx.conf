user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # API istekleri için özel log formatı
    log_format api_log '$remote_addr - [$time_local] "$request" '
                       '$status $body_bytes_sent '
                       'RT:$request_time '
                       'Range:"$http_range" '
                       'Method:$request_method '
                       'UA:"$http_user_agent"';

    # Range saldırıları için özel log formatı
    log_format range_log '$remote_addr - [$time_local] "$request" '
                         '$status Range:"$http_range" '
                         'UA:"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    
    # API logları
    access_log /var/log/nginx/api_requests.log api_log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # MAP DEĞİŞKENLERİ - Site config'inden önce tanımlanmalı
    # Range isteği kontrolü
    map $http_range $is_range_request {
        default 0;
        "~." 1;
    }

    # Şüpheli Range pattern'lerini tespit et
    map $http_range $suspicious_range {
        default 0;
        "~bytes=0-0" 1;              # Tek byte istekleri
        "~,.*,.*,.*,.*," 1;          # 5'ten fazla range (DoS riski)
        "~bytes=-[0-9]{1,2}$" 1;     # Çok küçük suffix-range
    }

    # API endpoint tespiti
    map $request_uri $is_api_request {
        default 0;
        "~^/api/" 1;
    }

    # Rate Limiting Zone Tanımlamaları
    
    # Genel istek rate limiti (saniyede 60 istek)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

    # API endpoint'leri için rate limit (saniyede 30 istek - gevşetildi)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Range istekleri için özel rate limit (saniyede 2 istek)
    limit_req_zone $binary_remote_addr zone=range_limit:10m rate=2r/s;

    # Auth endpoint'leri için çok sıkı limit (saniyede 1 istek)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

    # Bağlantı sayısı limiti (aynı IP'den max 40 eşzamanlı bağlantı)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # IP başına toplam bandwidth limiti
    limit_rate_after 50m;
    limit_rate 5m;

    # Rate limit logları
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # Request Rate Limiting Status Code
    limit_req_status 429;
    limit_conn_status 429;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/atom+xml image/svg+xml application/vnd.api+json;

    # Buffer Güvenlik Ayarları
    client_body_buffer_size 1M;
    client_max_body_size 100M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeout Güvenlik Ayarları
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # Proxy Timeout Ayarları (default)
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Proxy Buffer Ayarları
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Request ID için
    map $request_id $req_id {
        default $request_id;
    }

    # Site yapılandırmalarını yükle
    include /etc/nginx/sites-enabled/*;
    include /etc/nginx/conf.d/*.conf;
}