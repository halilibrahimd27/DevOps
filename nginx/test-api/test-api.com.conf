server {
    listen 443 ssl;
    http2 on;
    server_name test-api.com;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/test.com.crt;
    ssl_certificate_key /etc/nginx/ssl/test.com.key;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers (always flag ile tüm response'lara eklenir)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Security-Policy "default-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Client Upload Limit
    client_max_body_size 100M;
    client_body_buffer_size 1M;

    # Rate Limiting (API için)
    limit_req zone=api_limit burst=50 nodelay;
    limit_req zone=general_limit burst=100 nodelay;
    limit_conn conn_limit 40;

    # Logging
    access_log /var/log/nginx/test-api.com.access.log;
    error_log /var/log/nginx/test-api.com.error.log;

    # Health Check Endpoint - Rate limit YOK
    location /api/health {
        proxy_pass http://127.0.0.1:8080/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # File Upload Endpoints - Özel koruma
    location ~ ^/api/(upload|media|files) {
        # Upload endpoint'leri için daha sıkı rate limit
        limit_req zone=api_limit burst=20 nodelay;
        
        # Büyük dosyalar için timeout artırımı
        client_body_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Range isteklerini engelle (upload sırasında)
        if ($http_range) {
            return 400;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Upload için buffer ayarları
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # File Download/Stream Endpoints - Range korumalı
    location ~ ^/api/(download|stream|export) {
        # Download için özel rate limit
        limit_req zone=api_limit burst=30 nodelay;

        # Çok fazla range isteği kontrolü (4+ range)
        if ($http_range ~* "bytes=.*-.*,.*-.*,.*-.*,.*-") {
            return 416;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range isteklerini proxy'e ilet
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Büyük dosyalar için timeout
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Accept-Ranges header ekle
        add_header Accept-Ranges bytes always;
    }

    # Static Asset/Media Files (eğer varsa)
    location ~ ^/storage/(.*\.(jpg|jpeg|png|gif|webp|pdf|mp4|mp3))$ {
        # Static media için range koruması
        limit_req zone=api_limit burst=50 nodelay;

        # Şüpheli range kontrolü - çoklu range
        if ($http_range ~* "bytes=.*-.*,.*-.*,.*-.*,.*-") {
            return 416;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range header'ları ilet
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Cache ayarları
        proxy_cache_valid 200 206 1h;
        proxy_cache_valid 416 1m;
        add_header X-Cache-Status $upstream_cache_status always;

        expires 7d;
        add_header Cache-Control "public, immutable" always;
        add_header Accept-Ranges bytes always;
    }

    # Authentication Endpoints - Daha sıkı rate limit
    location ~ ^/api/(login|register|password) {
        # Auth endpoint'leri için çok sıkı limit (brute force koruması)
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        # Range istekleri auth'da anlamsız
        if ($http_range) {
            return 400;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Auth için timeout
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Main API Location
    location /api/ {
        # API için standart rate limit
        limit_req zone=api_limit burst=50 nodelay;

        # Çoklu range kontrolü
        if ($http_range ~* "bytes=.*-.*,.*-.*,.*-.*,.*-") {
            return 416;
        }

        # Şüpheli range kontrolü (tek byte, küçük suffix)
        if ($suspicious_range) {
            return 416;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Range header'ları ilet (API response'ları için)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Timeout Settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer Settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Root Location (fallback)
    location / {
        # Şüpheli range kontrolü
        if ($suspicious_range) {
            return 416;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Range header support
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Timeout Settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer Settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Güvenlik: Hassas dosyalara erişimi engelle
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    # Güvenlik: Hassas dizinlere erişimi engelle
    location ~ ^/(vendor|storage/framework|storage/logs|bootstrap/cache) {
        deny all;
        return 404;
    }
}