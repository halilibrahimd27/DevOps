server {
    listen 443 ssl;
    http2 on;
    server_name crm.bienbulut.com;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/bienbulut.com.crt;
    ssl_certificate_key /etc/nginx/ssl/bienbulut.com.key;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers (always flag ile tüm response'lara eklenir)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client Upload Limit
    client_max_body_size 50M;

    # Rate Limiting Uygulamaları
    limit_req zone=general_limit burst=100 nodelay;
    limit_conn conn_limit 40;

    # Logging
    access_log /var/log/nginx/crm.bienbulut.com.access.log;
    error_log /var/log/nginx/crm.bienbulut.com.error.log;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Static Files Caching - Range korumalı
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # Static dosyalar için daha gevşek rate limit (sayfa yüklemelerinde çok paralel istek var)
        limit_req zone=general_limit burst=100 nodelay;

        # Çok fazla range isteği kontrolü
        if ($http_range ~* "bytes=.*-.*,.*-.*,.*-.*,.*-") {
            return 416;
        }

        # Şüpheli range kontrolü
        if ($suspicious_range) {
            return 416;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range isteklerini proxy'e ilet
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Accept-Ranges bytes always;
    }

    # Main Application
    location / {
        # Şüpheli range kontrolü
        if ($suspicious_range) {
            return 416;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Range başlıklarını ilet
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Timeout Settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer Settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # SPA Support (for React/Vue routing)
        try_files $uri $uri/ @fallback;
    }

    # SPA Fallback
    location @fallback {
        # Şüpheli range kontrolü
        if ($suspicious_range) {
            return 416;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Güvenlik: Hassas dosyalara erişimi engelle
    location ~ /\. {
        deny all;
        return 404;
    }

    # Nginx status endpoint (opsiyonel - monitoring için)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}