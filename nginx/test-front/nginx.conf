user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Range saldırıları için özel log formatı
    log_format range_log '$remote_addr - [$time_local] "$request" '
                         '$status Range:"$http_range" '
                         'UA:"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # MAP DEĞİŞKENLERİ - Site config'inden önce tanımlanmalı
    # Range isteği kontrolü
    map $http_range $is_range_request {
        default 0;
        "~." 1;
    }

    # Şüpheli Range pattern'lerini tespit et
    map $http_range $suspicious_range {
        default 0;
        "~bytes=0-0" 1;              # Tek byte istekleri
        "~,.*,.*,.*,.*," 1;          # 5'ten fazla range (DoS riski)
        "~bytes=-[0-9]{1,2}$" 1;     # Çok küçük suffix-range
    }

    # Rate Limiting Zone Tanımlamaları
    # Genel istek rate limiti (saniyede 60 istek - frontend için gevşetildi)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

    # Range istekleri için özel rate limit (saniyede 2 istek)
    limit_req_zone $binary_remote_addr zone=range_limit:10m rate=2r/s;

    # Bağlantı sayısı limiti (aynı IP'den max 40 eşzamanlı bağlantı)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # IP başına toplam bandwidth limiti (opsiyonel)
    limit_rate_after 10m;
    limit_rate 1m;

    # Rate limit logları
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # Request Rate Limiting Status Code
    limit_req_status 429;
    limit_conn_status 429;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # Buffer Güvenlik Ayarları
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeout Güvenlik Ayarları
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Proxy Timeout Ayarları
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Site yapılandırmalarını yükle
    include /etc/nginx/sites-enabled/*;
    include /etc/nginx/conf.d/*.conf;
}