global:
  resolve_timeout: 10m
  smtp_smarthost: 'localhost:587'
  smtp_from: 'monitoring@company.com'
  smtp_auth_username: 'monitoring@company.com'
  smtp_auth_password: 'your-email-password'

# Production routing with different severity handling
route:
  group_by: ['alertname', 'cluster', 'service_type']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'default-receiver'

  routes:
    # Critical alerts - immediate notification
    - matchers:
        - severity="critical"
      receiver: 'critical-alerts'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 30m

    # Database alerts - specialized handling
    - matchers:
        - service_type="database"
      receiver: 'database-team'
      group_interval: 2m
      repeat_interval: 2h

    # API alerts - development team
    - matchers:
        - service_type="api"
      receiver: 'api-team'
      group_interval: 3m
      repeat_interval: 4h

    # Warning alerts - less frequent
    - matchers:
        - severity="warning"
      receiver: 'warning-alerts'
      group_interval: 10m
      repeat_interval: 6h

# Production receivers with multiple notification channels
receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:3001/api/push/monitoring'
        title: 'Production Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'critical-alerts'
    email_configs:
      - to: 'devops@company.com,oncall@company.com'
        subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        body: |
          Critical alert detected in production environment:

          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Service Type: {{ .Labels.service_type }}
          Started: {{ .StartsAt }}
          {{ end }}
    webhook_configs:
      - url: 'http://localhost:3001/api/push/critical'
        title: '🚨 CRITICAL ALERT'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'database-team'
    email_configs:
      - to: 'dba@company.com,devops@company.com'
        subject: '🗄️ Database Alert: {{ .GroupLabels.alertname }}'
        body: |
          Database related alert:

          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Database: {{ .Labels.hostname }}
          Application: {{ .Labels.application }}
          Started: {{ .StartsAt }}
          {{ end }}

  - name: 'api-team'
    email_configs:
      - to: 'developers@company.com'
        subject: '🔌 API Alert: {{ .GroupLabels.alertname }}'
        body: |
          API service alert:

          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          API Service: {{ .Labels.hostname }}
          Application: {{ .Labels.application }}
          Started: {{ .StartsAt }}
          {{ end }}

  - name: 'warning-alerts'
    email_configs:
      - to: 'monitoring@company.com'
        subject: '⚠️ Warning: {{ .GroupLabels.alertname }}'
        body: |
          Warning alert:

          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Service Type: {{ .Labels.service_type }}
          Started: {{ .StartsAt }}
          {{ end }}

# Enhanced inhibit rules for production
inhibit_rules:
  # If instance is down, suppress all other alerts from that instance
  - source_matchers:
      - alertname="InstanceDown"
    target_matchers:
      - alertname!="InstanceDown"
    equal: ['instance']

  # If node exporter is down, suppress node-related alerts
  - source_matchers:
      - alertname="NodeExporterDown"
    target_matchers:
      - alertname=~"High.*Usage|Critical.*Usage"
    equal: ['instance']

  # If critical alert is firing, suppress warning alerts of same type
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'instance']

  # If database is down, suppress connection-related alerts
  - source_matchers:
      - alertname="PostgreSQLDown"
    target_matchers:
      - alertname=~"PostgreSQL.*Connection.*"
    equal: ['instance']

  # If API health check fails, suppress response time alerts
  - source_matchers:
      - alertname="ApplicationHealthCheckFailed"
    target_matchers:
      - alertname=~".*ResponseTime.*"
    equal: ['instance']

# Silence rules for maintenance windows
# (These would typically be managed via API calls during maintenance)
templates:
  - '/etc/alertmanager/templates/*.tmpl'
