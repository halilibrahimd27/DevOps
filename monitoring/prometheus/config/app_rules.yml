groups:
  # Application-Specific Alerts
  - name: applications.services
    rules:
      - alert: ApiServiceDown
        expr: up{service_type="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API Service down: {{ $labels.hostname }}"
          description: "{{ $labels.application }} API service on {{ $labels.hostname }} has been down for more than 1 minute."

      - alert: FrontendServiceDown
        expr: up{service_type="frontend"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Frontend Service down: {{ $labels.hostname }}"
          description: "{{ $labels.application }} Frontend service on {{ $labels.hostname }} has been down for more than 2 minutes."

      - alert: ApplicationHealthCheckFailed
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Application health check failed"
          description: "Health check failed for {{ $labels.instance }} for more than 2 minutes."

      - alert: ApiResponseTimeHigh
        expr: probe_duration_seconds{job="blackbox-http"} > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API response time is high"
          description: "API endpoint {{ $labels.instance }} response time is {{ $value }}s, which is above 5 seconds for more than 3 minutes."

      - alert: ApiResponseTimeCritical
        expr: probe_duration_seconds{job="blackbox-http"} > 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API response time is critical"
          description: "API endpoint {{ $labels.instance }} response time is {{ $value }}s, which is critically high."

  # Container-Specific Alerts
  - name: applications.containers
    rules:
      - alert: ContainerKilled
        expr: time() - container_last_seen{name!~".*POD.*"} > 60
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container killed on {{ $labels.hostname }}"
          description: "Container {{ $labels.name }} has disappeared from {{ $labels.hostname }} ({{ $labels.service_type }})"

      - alert: ContainerHighCpuUsage
        expr: (sum(rate(container_cpu_usage_seconds_total{name!~".*POD.*"}[5m])) by (instance,name,application) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container High CPU usage on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} CPU usage is above 80% on {{ $labels.instance }} for more than 5 minutes. Current: {{ $value }}%"

      - alert: ContainerCriticalCpuUsage
        expr: (sum(rate(container_cpu_usage_seconds_total{name!~".*POD.*"}[5m])) by (instance,name,application) * 100) > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container Critical CPU usage on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} CPU usage is critically high at {{ $value }}% on {{ $labels.instance }}."

      - alert: ContainerHighMemoryUsage
        expr: (container_memory_usage_bytes{name!~".*POD.*"} / container_spec_memory_limit_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container High Memory usage on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} Memory usage is above 80% on {{ $labels.instance }} for more than 5 minutes. Current: {{ $value }}%"

      - alert: ContainerMemoryLeak
        expr: increase(container_memory_usage_bytes{name!~".*POD.*"}[30m]) > 100*1024*1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Possible memory leak in container {{ $labels.name }}"
          description: "Container {{ $labels.name }} on {{ $labels.instance }} memory usage increased by {{ $value | humanize }} in the last 30 minutes."

      - alert: ContainerRestartLoop
        expr: increase(container_start_time_seconds{name!~".*POD.*"}[1h]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container restart loop detected"
          description: "Container {{ $labels.name }} on {{ $labels.instance }} has restarted {{ $value }} times in the last hour."

  # Application Performance Alerts
  - name: applications.performance
    rules:
      - alert: HighRequestRate
        expr: rate(prometheus_http_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High request rate detected"
          description: "Application is receiving {{ $value }} requests/sec on {{ $labels.instance }}"

      - alert: ApplicationErrorRateHigh
        expr: rate(prometheus_http_requests_total{code!~"2.."}[5m]) / rate(prometheus_http_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Application error rate is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      - alert: ApplicationErrorRateCritical
        expr: rate(prometheus_http_requests_total{code!~"2.."}[5m]) / rate(prometheus_http_requests_total[5m]) > 0.25
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical error rate detected"
          description: "Application error rate is critically high at {{ $value | humanizePercentage }} on {{ $labels.instance }}"

  # Application-Specific Resource Alerts
  - name: applications.resources
    rules:
      - alert: ApiServerHighLoad
        expr: 100 - (avg by(instance,application) (rate(node_cpu_seconds_total{service_type="api",mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load on API server {{ $labels.instance }}"
          description: "{{ $labels.application }} API server {{ $labels.instance }} CPU usage is {{ $value }}%"

      - alert: FrontendServerHighLoad
        expr: 100 - (avg by(instance,application) (rate(node_cpu_seconds_total{service_type="frontend",mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load on Frontend server {{ $labels.instance }}"
          description: "{{ $labels.application }} Frontend server {{ $labels.instance }} CPU usage is {{ $value }}%"

      - alert: ApplicationServerOutOfMemory
        expr: (1 - (node_memory_MemAvailable_bytes{service_type=~"api|frontend"} / node_memory_MemTotal_bytes{service_type=~"api|frontend"})) * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Application server out of memory"
          description: "{{ $labels.application }} server {{ $labels.instance }} ({{ $labels.service_type }}) is running out of memory: {{ $value }}%"

  # Business Logic Alerts (Example patterns)
  - name: applications.business
    rules:
      - alert: EcommerceOrderProcessingDelay
        expr: avg_over_time(probe_duration_seconds{instance=~".*ecommerce.*"}[10m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "E-commerce order processing is slow"
          description: "E-commerce application response time averaged {{ $value }}s over the last 10 minutes, indicating potential order processing delays."

      - alert: CrmDatabaseConnectionIssue
        expr: pg_stat_database_numbackends{database="crm"} < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRM database has no active connections"
          description: "CRM database on {{ $labels.instance }} has no active connections, indicating a potential connectivity issue."

      - alert: PlatformServiceDegraded
        expr: probe_success{instance=~".*platform.*"} < 1 or probe_duration_seconds{instance=~".*platform.*"} > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Platform service performance degraded"
          description: "Platform service is either down or responding slowly ({{ $value }}s response time)."