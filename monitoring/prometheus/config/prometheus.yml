global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    datacenter: 'main'

rule_files:
  - "alert_rules.yml"
  - "db_rules.yml"
  - "app_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Self monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service_type: 'monitoring'

  # Production Node Exporters - API Servers
  - job_name: 'node-exporter-api'
    static_configs:
      - targets: ['172.168.20.154:9100']
        labels:
          hostname: 'ecommerce-api'
          service_type: 'api'
          application: 'ecommerce'
      - targets: ['172.168.20.157:9100']
        labels:
          hostname: 'crm-api'
          service_type: 'api'
          application: 'crm'
      - targets: ['172.168.20.160:9100']
        labels:
          hostname: 'onmuhasebe-api'
          service_type: 'api'
          application: 'onmuhasebe'
      - targets: ['172.168.20.163:9100']
        labels:
          hostname: 'ik-api'
          service_type: 'api'
          application: 'ik'
      - targets: ['172.168.20.166:9100']
        labels:
          hostname: 'platform-api'
          service_type: 'api'
          application: 'platform'
      - targets: ['172.168.20.169:9100']
        labels:
          hostname: 'earsiv-api'
          service_type: 'api'
          application: 'earsiv'
    relabel_configs:
      - source_labels: [hostname]
        target_label: instance

  # Production Node Exporters - Frontend Servers
  - job_name: 'node-exporter-frontend'
    static_configs:
      - targets: ['172.168.20.155:9100']
        labels:
          hostname: 'ecommerce-front'
          service_type: 'frontend'
          application: 'ecommerce'
      - targets: ['172.168.20.158:9100']
        labels:
          hostname: 'crm-front'
          service_type: 'frontend'
          application: 'crm'
      - targets: ['172.168.20.161:9100']
        labels:
          hostname: 'onmuhasebe-front'
          service_type: 'frontend'
          application: 'onmuhasebe'
      - targets: ['172.168.20.164:9100']
        labels:
          hostname: 'ik-front'
          service_type: 'frontend'
          application: 'ik'
      - targets: ['172.168.20.167:9100']
        labels:
          hostname: 'platform-front'
          service_type: 'frontend'
          application: 'platform'
      - targets: ['172.168.20.170:9100']
        labels:
          hostname: 'earsiv-front'
          service_type: 'frontend'
          application: 'earsiv'
    relabel_configs:
      - source_labels: [hostname]
        target_label: instance

  # Production Node Exporters - Database Servers
  - job_name: 'node-exporter-database'
    static_configs:
      - targets: ['172.168.20.156:9100']
        labels:
          hostname: 'ecommerce-db'
          service_type: 'database'
          application: 'ecommerce'
      - targets: ['172.168.20.159:9100']
        labels:
          hostname: 'crm-db'
          service_type: 'database'
          application: 'crm'
      - targets: ['172.168.20.162:9100']
        labels:
          hostname: 'onmuhasebe-db'
          service_type: 'database'
          application: 'onmuhasebe'
      - targets: ['172.168.20.165:9100']
        labels:
          hostname: 'ik-db'
          service_type: 'database'
          application: 'ik'
      - targets: ['172.168.20.168:9100']
        labels:
          hostname: 'platform-db'
          service_type: 'database'
          application: 'platform'
      - targets: ['172.168.20.171:9100']
        labels:
          hostname: 'earsiv-db'
          service_type: 'database'
          application: 'earsiv'
    relabel_configs:
      - source_labels: [hostname]
        target_label: instance

# MySQL/MariaDB Exporters
  - job_name: 'mysql-exporter'
