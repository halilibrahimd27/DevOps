      - targets: ['172.168.20.156:9104']
        labels:
          hostname: 'ecommerce-db'
          database: 'ecommerce'
          db_type: 'mariadb'
      - targets: ['172.168.20.159:9104']
        labels:
          hostname: 'crm-db'
          database: 'crm'
          db_type: 'mariadb'
      - targets: ['172.168.20.162:9104']
        labels:
