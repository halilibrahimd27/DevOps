          hostname: 'ik-db'
          database: 'mongodb'
          db_type: 'mongodb'
      - targets: ['172.168.20.168:9216']
        labels:
          hostname: 'platform-db'
          database: 'mongodb'
          db_type: 'mongodb'
      - targets: ['172.168.20.171:9216']
