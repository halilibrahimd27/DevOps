global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    datacenter: 'main'

rule_files:
  - "alert_rules.yml"
  - "db_rules.yml"
  - "app_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Self monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service_type: 'monitoring'

  # Production Node Exporters - API Servers
  - job_name: 'node-exporter-api'
    static_configs:
      - targets: ['172.168.20.154:9100']
        labels:
          hostname: 'ecommerce-api'
          service_type: 'api'
          application: 'ecommerce'
      - targets: ['172.168.20.157:9100']
        labels:
          hostname: 'crm-api'
          service_type: 'api'
          application: 'crm'
      - targets: ['172.168.20.160:9100']
        labels:
          hostname: 'onmuhasebe-api'
          service_type: 'api'
          application: 'onmuhasebe'
      - targets: ['172.168.20.163:9100']
        labels:
          hostname: 'ik-api'
          service_type: 'api'
          application: 'ik'
      - targets: ['172.168.20.166:9100']
        labels:
          hostname: 'platform-api'
          service_type: 'api'
          application: 'platform'
      - targets: ['172.168.20.169:9100']
        labels:
          hostname: 'earsiv-api'
          service_type: 'api'
          application: 'earsiv'
    relabel_configs:
      - source_labels: [hostname]
        target_label: instance

  # Production Node Exporters - Frontend Servers
  - job_name: 'node-exporter-frontend'
    static_configs:
      - targets: ['172.168.20.155:9100']
        labels:
          hostname: 'ecommerce-front'
          service_type: 'frontend'
          application: 'ecommerce'
      - targets: ['172.168.20.158:9100']
        labels:
          hostname: 'crm-front'
          service_type: 'frontend'
          application: 'crm'
      - targets: ['172.168.20.161:9100']
        labels:
          hostname: 'onmuhasebe-front'
          service_type: 'frontend'
          application: 'onmuhasebe'
      - targets: ['172.168.20.164:9100']
        labels:
          hostname: 'ik-front'
          service_type: 'frontend'
          application: 'ik'
      - targets: ['172.168.20.167:9100']
        labels:
          hostname: 'platform-front'
          service_type: 'frontend'
          application: 'platform'
      - targets: ['172.168.20.170:9100']
        labels:
          hostname: 'earsiv-front'
          service_type: 'frontend'
          application: 'earsiv'
    relabel_configs:
      - source_labels: [hostname]
        target_label: instance

  # Production Node Exporters - Database Servers
  - job_name: 'node-exporter-database'
    static_configs:
      - targets: ['172.168.20.156:9100']
        labels:
          hostname: 'ecommerce-db'
          service_type: 'database'
          application: 'ecommerce'
      - targets: ['172.168.20.159:9100']
        labels:
          hostname: 'crm-db'
          service_type: 'database'
          application: 'crm'
      - targets: ['172.168.20.162:9100']
        labels:
          hostname: 'onmuhasebe-db'
          service_type: 'database'
          application: 'onmuhasebe'
      - targets: ['172.168.20.165:9100']
        labels:
          hostname: 'ik-db'
          service_type: 'database'
          application: 'ik'
      - targets: ['172.168.20.168:9100']
        labels:
          hostname: 'platform-db'
          service_type: 'database'
          application: 'platform'
      - targets: ['172.168.20.171:9100']
        labels:
          hostname: 'earsiv-db'
          service_type: 'database'
          application: 'earsiv'
    relabel_configs:
      - source_labels: [hostname]
        target_label: instance

  # Monitoring Server
  - job_name: 'node-exporter-monitoring'
    static_configs:
      - targets: ['172.168.20.153:9100']
        labels:
          hostname: 'monitoring'
          service_type: 'monitoring'
    relabel_configs:
      - source_labels: [hostname]
        target_label: instance

  # Container Monitoring - API Servers
  - job_name: 'cadvisor-api'
    static_configs:
      - targets: ['172.168.20.154:8088']
        labels:
          hostname: 'ecommerce-api'
          service_type: 'api'
          application: 'ecommerce'
      - targets: ['172.168.20.157:8088']
        labels:
          hostname: 'crm-api'
          service_type: 'api'
          application: 'crm'
      - targets: ['172.168.20.160:8088']
        labels:
          hostname: 'onmuhasebe-api'
          service_type: 'api'
          application: 'onmuhasebe'
      - targets: ['172.168.20.163:8088']
        labels:
          hostname: 'ik-api'
          service_type: 'api'
          application: 'ik'
      - targets: ['172.168.20.166:8088']
        labels:
          hostname: 'platform-api'
          service_type: 'api'
          application: 'platform'
      - targets: ['172.168.20.169:8088']
        labels:
          hostname: 'earsiv-api'
          service_type: 'api'
          application: 'earsiv'

  # Container Monitoring - Frontend Servers
  - job_name: 'cadvisor-frontend'
    static_configs:
      - targets: ['172.168.20.155:8088']
        labels:
          hostname: 'ecommerce-front'
          service_type: 'frontend'
          application: 'ecommerce'
      - targets: ['172.168.20.158:8088']
        labels:
          hostname: 'crm-front'
          service_type: 'frontend'
          application: 'crm'
      - targets: ['172.168.20.161:8088']
        labels:
          hostname: 'onmuhasebe-front'
          service_type: 'frontend'
          application: 'onmuhasebe'
      - targets: ['172.168.20.164:8088']
        labels:
          hostname: 'ik-front'
          service_type: 'frontend'
          application: 'ik'
      - targets: ['172.168.20.167:8088']
        labels:
          hostname: 'platform-front'
          service_type: 'frontend'
          application: 'platform'
      - targets: ['172.168.20.170:8088']
        labels:
          hostname: 'earsiv-front'
          service_type: 'frontend'
          application: 'earsiv'

  # Container Monitoring - Database Servers
  - job_name: 'cadvisor-database'
    static_configs:
      - targets: ['172.168.20.156:8088']
        labels:
          hostname: 'ecommerce-db'
          service_type: 'database'
          application: 'ecommerce'
      - targets: ['172.168.20.159:8088']
        labels:
          hostname: 'crm-db'
          service_type: 'database'
          application: 'crm'
      - targets: ['172.168.20.162:8088']
        labels:
          hostname: 'onmuhasebe-db'
          service_type: 'database'
          application: 'onmuhasebe'
      - targets: ['172.168.20.165:8088']
        labels:
          hostname: 'ik-db'
          service_type: 'database'
          application: 'ik'
      - targets: ['172.168.20.168:8088']
        labels:
          hostname: 'platform-db'
          service_type: 'database'
          application: 'platform'
      - targets: ['172.168.20.171:8088']
        labels:
          hostname: 'earsiv-db'
          service_type: 'database'
          application: 'earsiv'

  # PostgreSQL Exporters for Databases
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['172.168.20.156:9187']
        labels:
          hostname: 'ecommerce-db'
          database: 'ecommerce'
      - targets: ['172.168.20.159:9187']
        labels:
          hostname: 'crm-db'
          database: 'crm'
      - targets: ['172.168.20.162:9187']
        labels:
          hostname: 'onmuhasebe-db'
          database: 'onmuhasebe'
      - targets: ['172.168.20.165:9187']
        labels:
          hostname: 'ik-db'
          database: 'ik'
      - targets: ['172.168.20.168:9187']
        labels:
          hostname: 'platform-db'
          database: 'platform'
      - targets: ['172.168.20.171:9187']
        labels:
          hostname: 'earsiv-db'
          database: 'earsiv'

  # Process Exporters for critical services
  - job_name: 'process-exporter'
    static_configs:
      - targets: ['172.168.20.154:9256', '172.168.20.157:9256', '172.168.20.160:9256', '172.168.20.163:9256', '172.168.20.166:9256', '172.168.20.169:9256']
        labels:
          service_type: 'api'
      - targets: ['172.168.20.155:9256', '172.168.20.158:9256', '172.168.20.161:9256', '172.168.20.164:9256', '172.168.20.167:9256', '172.168.20.170:9256']
        labels:
          service_type: 'frontend'

  # Application Health Check via Blackbox
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://172.168.20.154:8000/health
        - http://172.168.20.157:8000/health
        - http://172.168.20.160:8000/health
        - http://172.168.20.163:8000/health
        - http://172.168.20.166:8000/health
        - http://172.168.20.169:8000/health
        labels:
          service_type: 'api-health'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
