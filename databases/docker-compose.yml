version: '3.8'

networks:
  database_network:
    driver: bridge

volumes:
  mariadb_data:
  postgresql_data:
  mongodb_data:
  redis_data:

services:
  # MariaDB
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Na9528692
      MYSQL_DATABASE: defaultdb
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: Na9528692
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/config/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - database_network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

# phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      MYSQL_ROOT_PASSWORD: Na9528692
      PMA_TIMEOUT: 1800
      # Import limiti artırma
      UPLOAD_LIMIT: 1G
      MEMORY_LIMIT: 1G
      MAX_EXECUTION_TIME: 0
    depends_on:
      - mariadb
    networks:
      - database_network

  # PostgreSQL
  postgresql:
    image: postgres:15
    container_name: postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: defaultdb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Na9528692
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - database_network

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: Na9528692
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./pgadmin:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgresql
    networks:
      - database_network

  # MongoDB (4.4 - AVX desteği gerektirmez)
  mongodb:
    image: mongo:4.4
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: Na9528692
      MONGO_INITDB_DATABASE: defaultdb
    volumes:
      - mongodb_data:/data/db
    networks:
      - database_network

  # Mongo Express (MongoDB Web UI)
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8083:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: Na9528692
      ME_CONFIG_MONGODB_URL: mongodb://root:Na9528692@mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - database_network

  # MongoDB Exporter
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    restart: unless-stopped
    ports:
      - "9216:9216"
    environment:
      MONGODB_URI: "mongodb://root:Na9528692@mongodb:27017/?authSource=admin"
    depends_on:
      - mongodb
    networks:
      - database_network
    command:
      - --mongodb.uri=mongodb://root:Na9528692@mongodb:27017/?authSource=admin
      - --mongodb.collstats-colls=
      - --mongodb.indexstats-colls=
      - --web.listen-address=:9216

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass Na9528692 --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - database_network

  # Redis Commander
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    ports:
      - "8084:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:Na9528692
      HTTP_USER: ""
      HTTP_PASSWORD: ""
    depends_on:
      - redis
    networks:
      - database_network

  # Adminer (Universal DB Admin)
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    networks:
      - database_network

  # Nginx with Basic Auth for Dashboard
  nginx-dashboard:
    image: nginx:alpine
    container_name: nginx-dashboard
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - database_network

  # Database Exporters for Monitoring
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    environment:
      DATA_SOURCE_NAME: "root:Na9528692@tcp(mariadb:3306)/"
    depends_on:
      - mariadb
    networks:
      - database_network
    command:
      - --mysqld.address=mariadb:3306
      - --mysqld.username=root

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://root:Na9528692@postgresql:5432/defaultdb?sslmode=disable"
    depends_on:
      - postgresql
    networks:
      - database_network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "Na9528692"
    depends_on:
      - redis
    networks:
      - database_network