# lychee link-checker config
# Docs: https://lychee.cli.rs/usage/config/

max_retries = 2
timeout = 30
max_concurrency = 6
retry_wait_time = 5

# 200-299 OK, 403/429 = login/rate-limit (link sağ)
accept = ["200..=299", "403", "429"]
include_fragments = false

# Atlamalar — placeholder URL'ler ve sürekli 4xx/5xx veren tarihsel link'ler
exclude = [
    # Local placeholder URLs
    "^https?://(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)",
    "^https?://[0-9.]+:[0-9]+",  # bare IP:port

    # Placeholder domain'ler — repo'da example olarak geçenler
    "^https?://(example|yourdomain|your-?domain|company|your-?company)\\.(com|org|net|io|dev)",
    "^https?://[a-z0-9-]+\\.(yourdomain|your-?domain|company|your-?company|example)\\.",
    "your-?(domain|company|registry|cluster|grafana|app|svc|service|cluster)",
    "<[A-Z_]+>",
    "%24%7B[A-Z_]+%7D",  # ${VAR} URL-encoded

    # Internal/cluster hostname'leri (DNS yok)
    "^https?://(elasticsearch|prometheus|grafana|kibana|loki|jaeger|tempo|alertmanager|kafka|redis|postgres|mysql|mongodb|registry|argocd|vault):",
    "^https?://[a-z]+\\.(svc|cluster|local)(\\.|:|/|$)",
    "\\.svc\\.cluster\\.local",

    # Repo'nun GitHub dynamic page'leri (filter URL'leri)
    "^https?://github\\.com/.+/(issues|pull|discussions|labels)/.*\\?",
    # github.com/.../... gibi placeholder PR URL'leri
    "^https?://github\\.com/\\.\\.\\.",

    # Twitter/X — sürekli rate-limit / 403
    "^https?://(twitter|x)\\.com",
    "^https?://t\\.co",

    # LinkedIn — login wall
    "^https?://(www\\.)?linkedin\\.com",

    # Self-reference (Pages henüz live olmadığında flake)
    "^https?://halilibrahimd27\\.github\\.io/DevOps",

    # Tarihsel olarak 404/down olan kaynaklar — issue ile düzeltilecek
    "^https?://linuxacademy\\.com",  # ACG'ye alındı
    "^https?://etsyjs\\.gitbook\\.io",  # Etsy gitbook hesabı kapandı
    "^https?://github\\.com/awesome-slo/awesome-slo",  # repo silinmiş
    "^https?://owasp\\.org/www-project-container-security",  # URL değişmiş

    # Mailto / tel
    "^mailto:",
    "^tel:",
]

verbose = "info"
