# L19 — Prometheus: scrape + alert kuralları + Alertmanager'a gönderim
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["app:9200"]
