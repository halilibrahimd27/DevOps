# hpa.yaml (referans) — CPU %50 hedef.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lab-app
  namespace: lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lab-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
