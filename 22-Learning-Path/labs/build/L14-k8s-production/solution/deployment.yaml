# deployment.yaml (referans) — request/limit + iki probe. Önce KENDİN dene.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
  namespace: lab
  labels: { app: lab-app }
spec:
  replicas: 2
  selector:
    matchLabels: { app: lab-app }
  template:
    metadata:
      labels: { app: lab-app }
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "100m", memory: "64Mi" }   # garanti
            limits:   { cpu: "300m", memory: "128Mi" }   # tavan — bellekte aşılırsa OOMKilled
          readinessProbe:                                 # trafiğe hazır mı
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:                                  # kilitlendi mi → restart
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
